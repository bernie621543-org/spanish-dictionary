name: 自動備份 Google 試算表至 lexicon(local)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: write

jobs:
  backup-lexicon:
    runs-on: ubuntu-latest
    steps:
      - name: 取得最新儲存庫內容
        uses: actions/checkout@v4

      - name: 下載 Google 試算表並生成備份檔
        env:
          MORPHEMES_URL: "https://docs.google.com/spreadsheets/d/1Y5Tdp5xYBfuhEtIuLNTG0HJQW5sD5SWQ8TofVxwNOHk/gviz/tq?tqx=out:csv&sheet=MORPHEMES"
          WORDS_URL: "https://docs.google.com/spreadsheets/d/1Y5Tdp5xYBfuhEtIuLNTG0HJQW5sD5SWQ8TofVxwNOHk/gviz/tq?tqx=out:csv&sheet=WORDS"
        run: |
          python3 - << 'EOF'
          import csv, io, json, os, urllib.request

          def fetch_csv(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp:
                  text = resp.read().decode('utf-8-sig')
              return list(csv.reader(io.StringIO(text)))

          m_rows = fetch_csv(os.environ['MORPHEMES_URL'])
          w_rows = fetch_csv(os.environ['WORDS_URL'])

          morphemes = []
          for r in m_rows[1:]:
              if len(r) >= 3 and r[0].strip() and r[2].strip():
                  morphemes.append([
                      r[0].strip(),
                      r[1].strip() if len(r) > 1 and r[1].strip() else "root",
                      r[2].strip(),
                      r[3].strip() if len(r) > 3 else "",
                      r[4].strip() if len(r) > 4 else ""
                  ])

          words = []
          for r in w_rows[1:]:
              if len(r) >= 1 and r[0].strip():
                  raw_ids = r[3] if len(r) > 3 else ""
                  m_ids = [x.strip() for x in raw_ids.replace('，', ',').replace('；', ',').split(',') if x.strip()]
                  custom_brk = r[4].strip() if len(r) > 4 else ""
                  if custom_brk:
                      words.append([r[0].strip(), r[1].strip() if len(r)>1 else "", r[2].strip() if len(r)>2 else "", m_ids, custom_brk])
                  else:
                      words.append([r[0].strip(), r[1].strip() if len(r)>1 else "", r[2].strip() if len(r)>2 else "", m_ids])

          os.makedirs("backups", exist_ok=True)
          output_filename = "backups/lexicon(local).js"

          js_output = (
              "// 自動從 Google Sheets 匯出\n"
              "window.MORPHEMES = " + json.dumps(morphemes, ensure_ascii=False, indent=2) + ";\n\n"
              "window.WORDS = " + json.dumps(words, ensure_ascii=False, indent=2) + ";\n"
          )

          with open(output_filename, "w", encoding="utf-8") as f:
              f.write(js_output)
          print(f"已生成檔案：{output_filename}（{len(morphemes)} 個詞素、{len(words)} 個單字）")
          EOF

      - name: 提交檔案至儲存庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if ! git diff --staged --quiet; then
            git commit -m "chore: 更新 lexicon(local).js"
            git push
          else
            echo "內容無變動，略過提交。"
          fi
