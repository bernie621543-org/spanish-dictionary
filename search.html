<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>結果預覽 - 西班牙文全構詞詞素字典</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 全域頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-6">
        <a href="index.html" class="flex items-center gap-2.5 group">
          <span class="w-8 h-8 rounded-lg bg-slate-900 text-white font-bold text-sm flex items-center justify-center shadow-sm group-hover:bg-slate-800 transition-colors">Ñ</span>
          <span class="font-bold text-slate-900 text-base sm:text-lg tracking-tight">西班牙文全構詞詞素字典</span>
        </a>
        <nav class="hidden sm:flex items-center gap-5 text-sm">
          <a href="index.html" id="nav-home" class="text-slate-600 hover:text-slate-900 font-medium transition-colors">首頁</a>
          <a href="index.html#all-morphemes" id="nav-all" class="text-slate-600 font-medium">所有詞素</a>
        </nav>
      </div>

      <!-- 右側快速搜尋 -->
      <form id="nav-search-form" class="flex items-center gap-1.5 w-44 sm:w-64">
        <div class="relative flex-1">
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input
            type="text"
            id="nav-search-input"
            placeholder="快速搜尋..."
            class="w-full pl-8 pr-2.5 py-1.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:bg-white focus:border-slate-400 transition-colors"
          />
        </div>
        <button type="submit" class="px-2.5 py-1.5 text-xs font-semibold bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition-colors shrink-0">
          搜尋
        </button>
      </form>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-7 space-y-7">
    <!-- 置中詞素查詢區塊 -->
    <section class="bg-white rounded-2xl border border-slate-200/90 shadow-sm px-6 py-8 sm:px-10 sm:py-9">
      <div class="max-w-3xl mx-auto text-center space-y-4">
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight flex items-center justify-center gap-2">
          <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <span>詞素查詢</span>
        </h1>
        <form id="search-page-form" class="flex flex-col sm:flex-row gap-3">
          <input
            type="text"
            id="search-page-input"
            placeholder="請輸入文字...（詞素、西班牙文單字或中文意思）"
            class="flex-1 px-4 py-3.5 text-base bg-slate-50/70 border border-slate-300 rounded-xl focus:outline-none focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10 transition-all"
          />
          <button
            type="submit"
            class="px-7 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-base rounded-xl transition-colors flex items-center justify-center gap-2 shrink-0 shadow-sm"
          >
            <span>搜尋</span>
            <span>→</span>
          </button>
        </form>
      </div>
    </section>

    <!-- 結果預覽標題列 -->
    <section class="space-y-4">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-3">
          <h2 class="text-lg sm:text-xl font-bold text-slate-900">結果預覽</h2>
          <span id="query-pill" class="hidden px-2.5 py-0.5 rounded-md bg-slate-200/70 text-slate-700 text-xs font-semibold"></span>
        </div>
        <div class="text-sm font-semibold text-slate-600">
          共 <span id="result-count" class="text-slate-900 font-bold">0</span> 筆
        </div>
      </div>

      <!-- 空查詢或無結果提示 -->
      <div id="empty-state" class="hidden"></div>

      <!-- 雙欄分區：左邊詞素、右邊單字 -->
      <div id="split-results" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <!-- 左欄：詞素結果 (佔 5 欄) -->
        <div class="lg:col-span-5 space-y-3">
          <div class="flex items-center justify-between bg-white px-4 py-3 rounded-xl border border-slate-200/90 shadow-2xs">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
              <h3 class="text-base font-extrabold text-slate-900">詞素</h3>
            </div>
            <span class="text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200/80 px-2.5 py-0.5 rounded-full">
              <span id="morpheme-count">0</span> 筆
            </span>
          </div>
          <div id="morpheme-results-list" class="bg-white rounded-2xl border border-slate-200/90 shadow-2xs divide-y divide-slate-100 overflow-hidden"></div>
        </div>

        <!-- 右欄：單字結果 (佔 7 欄) -->
        <div class="lg:col-span-7 space-y-3">
          <div class="flex items-center justify-between bg-white px-4 py-3 rounded-xl border border-slate-200/90 shadow-2xs">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span>
              <h3 class="text-base font-extrabold text-slate-900">單字</h3>
            </div>
            <span class="text-xs font-bold text-sky-800 bg-sky-50 border border-sky-200/80 px-2.5 py-0.5 rounded-full">
              <span id="word-count">0</span> 筆
            </span>
          </div>
          <div id="word-results-list" class="bg-white rounded-2xl border border-slate-200/90 shadow-2xs divide-y divide-slate-100 overflow-hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="backups/lexicon(local).js"></script>
  <script src="lexicon.js"></script>
  <script>
    const TYPE_LABELS = {
      prefix: { text: '字首', cls: 'bg-sky-50 text-sky-700 border-sky-200' },
      root:   { text: '字根', cls: 'bg-amber-50 text-amber-700 border-amber-200' },
      suffix: { text: '字尾', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' }
    };

    function getLexiconItems() {
      const morphemes = Array.isArray(window.MORPHEMES) ? window.MORPHEMES : [];
      const words = Array.isArray(window.WORDS) ? window.WORDS : [];

      const morphemeMap = new Map();
      const items = morphemes.map((row, idx) => {
        const [id, type, form, origin, meaning] = row;
        const clean = (form || '').replace(/^-+/, '').trim();
        const firstChar = clean.charAt(0).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
        const letter = /^[A-Z]$/.test(firstChar) ? firstChar : '#';
        const item = {
          idx,
          id: String(id),
          type: type || 'root',
          form: form || '',
          origin: origin || '',
          meaning: meaning || '',
          letter,
          words: []
        };
        morphemeMap.set(item.id, item);
        return item;
      });

      words.forEach(w => {
        const [word, pos, zh, morphemeIds, customBreakdown] = w;
        const ids = Array.isArray(morphemeIds) ? morphemeIds.map(String) : [];

        const autoBreakdown = customBreakdown || ids.map(mId => {
          const m = morphemeMap.get(mId);
          if (!m) return mId;
          const shortMeaning = m.meaning
            .replace(/^.*表示「([^」]+)」.*$/, '$1')
            .replace(/（[^）]*）/g, '')
            .trim();
          return `${m.form} (${shortMeaning})`;
        }).join(' + ');

        const wordObj = {
          word: word || '',
          pos: pos || '',
          breakdown: autoBreakdown,
          zh: zh || '',
          morphemeIds: ids
        };

        ids.forEach(mId => {
          const targetMorpheme = morphemeMap.get(mId);
          if (targetMorpheme) {
            targetMorpheme.words.push(wordObj);
          }
        });
      });

      return items;
    }

    document.getElementById('nav-search-form')?.addEventListener('submit', function(e) {
      e.preventDefault();
      const q = (document.getElementById('nav-search-input')?.value || '').trim();
      if (q) {
        window.location.href = 'search.html?q=' + encodeURIComponent(q);
      }
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('lexiconUpdated', () => { if (typeof window.__renderLexiconPage === 'function') window.__renderLexiconPage(); });
    (window.__renderLexiconPage = function() {
      const items = getLexiconItems();
      const params = new URLSearchParams(window.location.search);
      const rawQuery = (params.get('q') || '').trim();

      const inputEl = document.getElementById('search-page-input');
      const navInputEl = document.getElementById('nav-search-input');
      inputEl.value = rawQuery;
      if (navInputEl) navInputEl.value = rawQuery;

      const queryPill = document.getElementById('query-pill');
      if (rawQuery) {
        queryPill.textContent = '關鍵字：' + rawQuery;
        queryPill.classList.remove('hidden');
      }

      document.getElementById('search-page-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const nextQ = (inputEl.value || '').trim();
        window.location.href = 'search.html?q=' + encodeURIComponent(nextQ);
      });

      function normalizeText(s) {
        return String(s || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');
      }

      // 解析詞素的所有變體形式 (例如 "-dad / -tad" -> ["dad", "tad"])
      function extractMorphemeVariants(formStr) {
        return String(formStr || '')
          .split('/')
          .map(part => part.replace(/\([^)]*\)/g, '').replace(/^-+|-+$/g, '').trim())
          .map(part => normalizeText(part))
          .filter(Boolean);
      }

      // 判斷某個詞素是否構成或包含在查詢的西班牙文單字中 (例如查 universidad -> 匹配 uni-, vert-/vers-, -dad/-tad)
      function doesWordContainMorpheme(wordQueryNorm, item) {
        // 僅對純西班牙文字母單字 (長度 >= 4) 執行自動拆解匹配
        if (!/^[a-zñ]{4,}$/.test(wordQueryNorm)) return false;

        // 1. 檢查該詞素收錄的衍生單字或拆解公式是否直接包含此單字
        const inRecordedWords = item.words.some(w => {
          const nw = normalizeText(w.word);
          return nw === wordQueryNorm || (wordQueryNorm.length >= 5 && nw.includes(wordQueryNorm));
        });
        if (inRecordedWords) return true;

        // 2. 依詞素類型 (字首/字尾/字根) 比對單字拼寫
        const variants = extractMorphemeVariants(item.form);
        return variants.some(v => {
          if (item.type === 'prefix') {
            // 字首必須位於單字開頭，且剩餘字幹至少保留 3 個字母 (避免 "a-" 誤中所有 a 開頭單字)
            return v.length >= 2 && wordQueryNorm.startsWith(v) && (wordQueryNorm.length - v.length) >= 3;
          }
          if (item.type === 'suffix') {
            // 字尾必須位於單字結尾，且前方字幹至少保留 3 個字母 (如 universidad 結尾 dad -> 剩 universi)
            return v.length >= 2 && wordQueryNorm.endsWith(v) && (wordQueryNorm.length - v.length) >= 3;
          }
          if (item.type === 'root') {
            // 字根為避免過短字母誤判，僅匹配長度 >= 3 的字根 (如 vers 出現於 universidad 中)
            return v.length >= 3 && wordQueryNorm.includes(v);
          }
          return false;
        });
      }

      const emptyStateEl = document.getElementById('empty-state');
      const splitContainer = document.getElementById('split-results');
      const morphemeListEl = document.getElementById('morpheme-results-list');
      const wordListEl = document.getElementById('word-results-list');

      if (!rawQuery) {
        splitContainer.classList.add('hidden');
        emptyStateEl.classList.remove('hidden');
        emptyStateEl.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center space-y-2">
            <p class="text-slate-700 font-semibold">請在上方輸入詞素、西班牙文單字或中文意思進行查詢</p>
            <p class="text-xs text-slate-400">例如：bio、tener、universidad、幸福</p>
          </div>
        `;
        return;
      }

      const nq = normalizeText(rawQuery);
      const cleanNq = nq.replace(/^-+|-+$/g, '');
      const morphemeMatches = [];
      const seenMorphemeIds = new Set();
      const wordMatches = [];
      const seenWords = new Set();

      // 計算詞素關聯性分數（分數越高越前面）
      function scoreMorphemeMatch(item, containedInWord) {
        const variants = extractMorphemeVariants(item.form);
        const normForm = normalizeText(item.form);
        const normMeaning = normalizeText(item.meaning);
        const normOrigin = normalizeText(item.origin);

        if (cleanNq) {
          // 1. 詞素變體完全相等（例如查 "re" 或 "re-" -> 精準命中 "re-"，排名第一）
          if (variants.some(v => v === cleanNq)) {
            return 1000 - variants.length;
          }
          // 2. 詞素變體以關鍵字開頭（例如查 "re" -> "re-", "retro-"；查 "pre" -> "pre-"）
          const startsIdx = variants.findIndex(v => v.startsWith(cleanNq));
          if (startsIdx !== -1) {
            const lenDiff = variants[startsIdx].length - cleanNq.length;
            return 850 - lenDiff * 5;
          }
          // 3. 詞素變體包含關鍵字（例如查 "re" -> "pre-", "cre-", "fren-"，字尾或越靠近結尾/越短越前面）
          const containsVariants = variants.filter(v => v.includes(cleanNq));
          if (containsVariants.length > 0) {
            const bestV = containsVariants.sort((a, b) => a.length - b.length)[0];
            const lenDiff = bestV.length - cleanNq.length;
            const endsBonus = bestV.endsWith(cleanNq) ? 30 : 0;
            return 700 + endsBonus - lenDiff * 5;
          }
        }

        // 4. 整串詞素顯示名稱包含關鍵字
        if (normForm.includes(nq)) {
          return 600 - (normForm.length - nq.length);
        }
        // 5. 詞素核心中文意思命中
        if (normMeaning.includes(nq)) {
          const exactMeaning = normMeaning.split(/[、，,；;（）()\s]+/).some(seg => seg === nq);
          return exactMeaning ? 520 : 450 - (normMeaning.length - nq.length);
        }
        // 6. 查詢整個單字時自動拆解出的內含詞素（依字首 -> 字根 -> 字尾）
        if (containedInWord) {
          const posScore = { prefix: 360, root: 340, suffix: 320 };
          return posScore[item.type] || 300;
        }
        // 7. 詞源說明命中
        if (normOrigin.includes(nq)) {
          return 200 - (normOrigin.length - nq.length) * 0.5;
        }
        return 0;
      }

      // 計算單字關聯性分數（分數越高越前面）
      function scoreWordMatch(w) {
        const nw = normalizeText(w.word);
        const nzh = normalizeText(w.zh);
        const nbrk = normalizeText(w.breakdown);

        if (nw === nq) return 1000;
        if (nw.startsWith(nq)) return 850 - (nw.length - nq.length) * 3;
        if (nw.includes(nq)) return 700 - (nw.length - nq.length) * 3;
        if (nzh === nq) return 650;
        if (nzh.includes(nq)) return 550 - (nzh.length - nq.length) * 2;
        if (nbrk.includes(nq)) return 400 - (nbrk.length - nq.length);
        return 0;
      }

      items.forEach(item => {
        const containedInSearchedWord = doesWordContainMorpheme(nq, item);
        const mScore = scoreMorphemeMatch(item, containedInSearchedWord);

        if (mScore > 0 && !seenMorphemeIds.has(item.id)) {
          seenMorphemeIds.add(item.id);
          morphemeMatches.push({
            item,
            score: mScore
          });
        }

        // 比對右欄單字結果（依單字去重，避免跨詞素單字重複顯示）
        item.words.forEach(w => {
          const wKey = normalizeText(w.word);
          if (seenWords.has(wKey)) return;
          const wScore = scoreWordMatch(w);

          if (wScore > 0) {
            seenWords.add(wKey);
            const primaryId = (w.morphemeIds && w.morphemeIds.length) ? w.morphemeIds[0] : item.id;
            wordMatches.push({ item: { id: primaryId }, wordObj: w, score: wScore });
          }
        });
      });

      // 依關聯性分數由高到低排序（同分時依字首 -> 字根 -> 字尾與原本順序排列）
      const typeOrder = { prefix: 1, root: 2, suffix: 3 };
      morphemeMatches.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        const tDiff = (typeOrder[a.item.type] || 9) - (typeOrder[b.item.type] || 9);
        if (tDiff !== 0) return tDiff;
        return a.item.idx - b.item.idx;
      });

      wordMatches.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return a.wordObj.word.localeCompare(b.wordObj.word, 'es');
      });

      const total = morphemeMatches.length + wordMatches.length;
      document.getElementById('result-count').textContent = total;
      document.getElementById('morpheme-count').textContent = morphemeMatches.length;
      document.getElementById('word-count').textContent = wordMatches.length;

      splitContainer.classList.remove('hidden');
      emptyStateEl.classList.add('hidden');

      if (total === 0) {
        splitContainer.classList.add('hidden');
        emptyStateEl.classList.remove('hidden');
        emptyStateEl.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center space-y-3">
            <p class="text-slate-800 font-bold text-base">找不到與「${escapeHtml(rawQuery)}」相符的結果</p>
            <p class="text-sm text-slate-500">建議嘗試縮短關鍵字，或檢查拼寫後重新搜尋。</p>
            <div class="pt-2">
              <a href="index.html" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800">
                回首頁瀏覽全部詞素
              </a>
            </div>
          </div>
        `;
        return;
      }

      function saveSearchReturnState() {
        sessionStorage.setItem('es_detail_return_v1', JSON.stringify({
          from: 'search',
          url: window.location.href,
          scrollY: window.scrollY
        }));
      }

      try {
        const ret = JSON.parse(sessionStorage.getItem('es_detail_return_v1') || 'null');
        if (ret && ret.from === 'search' && ret.url === window.location.href && ret.scrollY > 0) {
          requestAnimationFrame(() => window.scrollTo(0, ret.scrollY));
          sessionStorage.removeItem('es_detail_return_v1');
        }
      } catch (e) {}

      // 渲染左欄：詞素列表 (包含直接匹配與該單字內含的字首/字根/字尾)
      if (!morphemeMatches.length) {
        morphemeListEl.innerHTML = `
          <div class="p-8 text-center text-xs sm:text-sm text-slate-400">
            沒有相符的詞素項目
          </div>
        `;
      } else {
        morphemeListEl.innerHTML = morphemeMatches.map(({ item }) => {
          const badge = TYPE_LABELS[item.type] || TYPE_LABELS.root;
          const detailHref = 'detail.html?id=' + encodeURIComponent(item.id) + '&from=search&q=' + encodeURIComponent(rawQuery);
          return `
            <a href="${detailHref}" class="result-link group flex items-center justify-between gap-3 px-4 py-3.5 hover:bg-slate-50 transition-colors">
              <div class="min-w-0 space-y-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-base font-extrabold text-slate-900 group-hover:text-amber-800 transition-colors">${escapeHtml(item.form)}</span>
                  <span class="px-2 py-0.5 rounded-md border text-[11px] font-semibold ${badge.cls}">${badge.text}</span>
                </div>
                <p class="text-xs sm:text-sm text-slate-500 truncate">${escapeHtml(item.meaning)}</p>
              </div>
              <span class="w-8 h-8 rounded-lg bg-slate-100 group-hover:bg-slate-200/80 text-slate-600 text-xs font-bold flex items-center justify-center shrink-0 transition-colors">
                ${item.words.length}
              </span>
            </a>
          `;
        }).join('');
      }

      // 渲染右欄：單字列表
      if (!wordMatches.length) {
        wordListEl.innerHTML = `
          <div class="p-8 text-center text-xs sm:text-sm text-slate-400">
            沒有相符的單字項目
          </div>
        `;
      } else {
        wordListEl.innerHTML = wordMatches.map(({ item, wordObj: w }) => {
          const detailHref = 'detail.html?id=' + encodeURIComponent(item.id) + '&word=' + encodeURIComponent(w.word) + '&from=search&q=' + encodeURIComponent(rawQuery);
          return `
            <a href="${detailHref}" class="result-link group flex items-center justify-between gap-4 px-5 py-4 hover:bg-slate-50 transition-colors">
              <div class="min-w-0 space-y-1">
                <div class="flex items-baseline gap-2 flex-wrap">
                  <span class="text-base font-extrabold text-slate-900 group-hover:text-amber-800 transition-colors">${escapeHtml(w.word)}</span>
                  <span class="text-xs font-medium text-slate-400 italic">${escapeHtml(w.pos)}</span>
                </div>
                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${escapeHtml(w.zh)}</p>
              </div>
              <span class="inline-flex items-center gap-1 text-xs font-bold text-slate-400 group-hover:text-slate-900 shrink-0 transition-colors">
                <span>查看更多</span>
                <span>→</span>
              </span>
            </a>
          `;
        }).join('');
      }

      document.querySelectorAll('.result-link').forEach(link => {
        link.addEventListener('click', saveSearchReturnState);
      });
    })();

    window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'SYNC_WORD' && typeof event.data.word === 'string') {
    const incomingWord = event.data.word.trim();
    if (!incomingWord) return;
    const currentParams = new URLSearchParams(window.location.search);
    if ((currentParams.get('q') || '').trim() !== incomingWord) {
      const nextUrl = 'search.html?q=' + encodeURIComponent(incomingWord);
      window.history.replaceState(null, '', nextUrl);
      if (typeof window.__renderLexiconPage === 'function') {
        window.__renderLexiconPage();
      }
    }
  }
});
    
  </script>
</body>
</html>
